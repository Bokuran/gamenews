name: Сбор новостей из фидов

on:
  schedule:
    # Раз в 30 минут. GitHub может сдвигать cron на несколько минут,
    # а на неактивном репозитории вовсе перестать запускать.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Сколько черновиков создать'
        required: false
        default: '5'

# Push делаем от GITHUB_TOKEN; deploy.yml подхватится через workflow_run.
permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Опросить фиды и создать черновики
        # Значение идёт через env, а не вшиванием прямо в run:
        # подстановка ${{ }} в скрипт — вектор инъекции.
        env:
          COLLECT_LIMIT: ${{ github.event.inputs.limit || '5' }}
        run: node scripts/collect-news.mjs --write --limit="$COLLECT_LIMIT"

      - name: Закоммитить изменения
        run: |
          git config user.name "news-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "Новых материалов нет — коммитить нечего."
            exit 0
          fi

          git add src/content/news scripts/.state.json
          git commit -m "news: черновики $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
