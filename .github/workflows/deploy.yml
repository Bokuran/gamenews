name: Сборка и деплой на GitHub Pages

on:
  push:
    branches: [main]
  # Push от GITHUB_TOKEN не запускает соседние workflow, поэтому деплой
  # нужно триггерить явно — иначе черновики от коллектора не попадут на сайт.
  workflow_run:
    workflows: ['Сбор новостей из фидов']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Не отменяем деплой на середине — иначе Pages может остаться на полусобранной версии.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Для user-site (<login>.github.io) замени SITE_BASE на '/'
      SITE_URL: https://${{ github.repository_owner }}.github.io
      SITE_BASE: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Astro 7 требует Node >= 22.22
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Проверка типов и схемы контента
        run: npm run check

      - name: Сборка
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
